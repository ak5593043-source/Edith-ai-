  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="description" content="Minimal AMOLED black AI assistant ULTRON with 3D Voice Sphere, commanding voice, Personal Voice Print, multi-step Automation Engine, PDF creation, and live search." />
    <meta property="og:title" content="ULTRON – Personal AI Assistant" />
    <meta property="og:description" content="Minimal AMOLED black AI assistant ULTRON with 3D Voice Sphere, commanding voice, Personal Voice Print, multi-step Automation Engine, PDF creation, and live search." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Clear any stale Vite dev service worker that can stall preview loading in iframes
      if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(reg) {
            var url = (reg.active && reg.active.scriptURL) || (reg.installing && reg.installing.scriptURL) || '';
            if (url.indexOf('dev-sw.js') !== -1) {
              reg.unregister();
            }
          });
        }).catch(function() {});
      }
      // In AI Studio preview environment, HMR WebSocket is not proxied.
      // Suppress Vite HMR WebSocket connection notices.
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var ws;
            try {
              ws = protocols ? new NativeWebSocket(url, protocols) : new NativeWebSocket(url);
            } catch (err) {
              return { addEventListener: function() {}, removeEventListener: function() {}, close: function() {}, send: function() {} };
            }
            ws.addEventListener('error', function(e) {
              e.stopImmediatePropagation();
            }, true);
            ws.addEventListener('close', function(e) {
              e.stopImmediatePropagation();
            }, true);
            return ws;
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        }
        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && e.reason) ? String(e.reason.message || e.reason) : '';
          if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('vite') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-black text-white antialiased selection:bg-neutral-800 selection:text-white overflow-x-hidden min-h-screen font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
