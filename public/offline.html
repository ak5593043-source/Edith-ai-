<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ULTRON – Offline</title>
  <style>
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .logo {
      width: 72px;
      height: 72px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin: 0 0 12px 0;
      letter-spacing: -0.02em;
    }
    p {
      color: #A1A1AA;
      font-size: 15px;
      margin: 0 0 28px 0;
      max-width: 320px;
      line-height: 1.5;
    }
    button {
      background-color: #171717;
      border: 1px solid #262626;
      color: #FFFFFF;
      padding: 10px 24px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover {
      background-color: #262626;
    }
  </style>
</head>
<body>
  <img src="/icon.svg" alt="ULTRON" class="logo" />
  <h1>ULTRON is Offline</h1>
  <p>You are currently offline. Cached chats remain accessible once you reconnect.</p>
  <button onclick="window.location.reload()">Retry Connection</button>
</body>
</html>
